const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(word) {
  const enc = new TextEncoder(), norm = word.trim().toLowerCase();
  const base = await crypto.subtle.importKey('raw', enc.encode(norm), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(DATA.iv) }, key, b64(DATA.ct));
  return new TextDecoder().decode(plain);
}
function open2(html, word) { try { localStorage.setItem('cozycabin.word', word); } catch (e) {} document.open(); document.write(html); document.close(); }
(async () => {
  let saved = null; try { saved = localStorage.getItem('cozycabin.word'); } catch (e) {}
  if (saved) { try { return open2(await unlock(saved), saved); } catch (e) {} }
  document.getElementById('lock').style.display = 'block';
  document.getElementById('f').addEventListener('submit', async ev => {
    ev.preventDefault(); const w = document.getElementById('pw').value, m = document.getElementById('msg');
    if (!w.trim()) { m.textContent = 'Type the secret word first.'; return; }
    if (!window.crypto || !crypto.subtle) { m.textContent = 'This page needs to be opened from its https address.'; return; }
    m.textContent = '';
    try { open2(await unlock(w), w); } catch (e) { m.textContent = 'Not quite. Try again.'; }
  });
})();
